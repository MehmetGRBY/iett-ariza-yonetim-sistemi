<!doctype html>
<html lang="tr">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="description" content="İETT AYS işlem kayıtları" /><title>İşlem Kayıtları | İETT AYS</title></head>
  <body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
    <div class="app-wrapper">
      <nav class="app-header navbar navbar-expand bg-body shadow-sm"><div class="container-fluid"><button class="btn btn-link nav-link" type="button" data-lte-toggle="sidebar" aria-label="Menüyü aç veya kapat"><i class="bi bi-list fs-4"></i></button><span class="navbar-text ms-2 fw-semibold">İETT Arıza Yönetim Sistemi</span><div class="ms-auto d-flex align-items-center gap-3"><span class="text-secondary small" id="current-user">Oturum doğrulanıyor…</span><button class="btn btn-outline-danger btn-sm" id="logout-button" type="button">Çıkış</button></div></div></nav>
      <aside class="app-sidebar sidebar-iett shadow" data-bs-theme="dark"><div class="sidebar-brand border-bottom"><a href="./index.html" class="brand-link text-decoration-none"><span class="brand-text fw-bold text-white">İETT <span class="brand-accent">AYS</span></span></a></div><div class="sidebar-wrapper"><nav class="mt-2"><ul class="nav sidebar-menu flex-column" id="application-navigation" data-lte-toggle="treeview" role="menu"></ul></nav></div></aside>
      <main class="app-main">
        <div class="app-content-header"><div class="container-fluid py-3"><h1 class="mb-1">İşlem Kayıtları</h1><p class="text-secondary mb-0">Sistem değişikliklerinin silinemez ve salt okunur geçmişi</p></div></div>
        <div class="app-content"><div class="container-fluid">
          <div id="page-error" class="alert alert-danger d-none"></div>
          <div class="card shadow-sm mb-4"><div class="card-body"><form id="audit-filter-form" class="row g-3 align-items-end">
            <div class="col-12 col-xl-3"><label class="form-label" for="audit-search">Ara</label><input id="audit-search" class="form-control" type="search" placeholder="İşlem, tablo, açıklama veya kullanıcı" /></div>
            <div class="col-12 col-md-4 col-xl-3"><label class="form-label" for="entity-filter">Kayıt türü</label><select id="entity-filter" class="form-select"><option value="">Tüm kayıt türleri</option></select></div>
            <div class="col-12 col-md-4 col-xl-2"><label class="form-label" for="user-filter">Kullanıcı</label><select id="user-filter" class="form-select"><option value="">Tüm kullanıcılar</option></select></div>
            <div class="col-6 col-xl-1"><label class="form-label" for="start-date">Başlangıç</label><input id="start-date" class="form-control" type="date" /></div>
            <div class="col-6 col-xl-1"><label class="form-label" for="end-date">Bitiş</label><input id="end-date" class="form-control" type="date" /></div>
            <div class="col-12 col-xl-1 d-grid"><button class="btn btn-primary" type="submit"><i class="bi bi-funnel"></i></button></div>
          </form></div></div>
          <div class="card shadow-sm mb-4">
            <div class="card-header d-flex align-items-center"><h2 class="card-title mb-0">İşlem Geçmişi</h2><span id="audit-count" class="badge text-bg-secondary ms-auto">0 kayıt</span></div>
            <div id="loading" class="text-center py-5"><div class="spinner-border text-primary"></div></div>
            <div id="table-container" class="table-responsive d-none"><table class="table table-striped table-hover align-middle mb-0"><thead><tr><th>Tarih</th><th>Kullanıcı</th><th>Rol</th><th>İşlem</th><th>Kayıt</th><th>Açıklama</th><th>IP</th><th></th></tr></thead><tbody id="audit-body"></tbody></table></div>
            <div class="card-footer d-flex align-items-center justify-content-between gap-3"><button id="previous-page" class="btn btn-outline-secondary btn-sm" type="button"><i class="bi bi-chevron-left"></i> Önceki</button><span id="page-summary" class="small text-secondary">Sayfa 1 / 1</span><button id="next-page" class="btn btn-outline-secondary btn-sm" type="button">Sonraki <i class="bi bi-chevron-right"></i></button></div>
          </div>
        </div></div>
      </main>
      <footer class="app-footer"><span class="float-end d-none d-sm-inline">MG</span><strong>© 2026 İETT Arıza Yönetim Sistemi</strong></footer>
    </div>
    <div class="modal fade" id="audit-detail-modal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-xl modal-dialog-scrollable"><div class="modal-content"><div class="modal-header"><h2 id="audit-detail-title" class="modal-title fs-5">İşlem Detayı</h2><button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Kapat"></button></div><div id="audit-detail-content" class="modal-body"></div><div class="modal-footer"><button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">Kapat</button></div></div></div></div>
    <script type="module" src="/src/pages/audit-logs.js"></script>
  </body>
</html>
